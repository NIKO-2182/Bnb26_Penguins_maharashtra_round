version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fairdrop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "fairdrop"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://user:password@db:5432/fairdrop
      - HMAC_SECRET=${HMAC_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  sim:
    build:
      context: .
      dockerfile: sim/Dockerfile
    ports:
      - "8090:8090"
    depends_on:
      - api

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
